<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ .Params.pagetitle }}</title>

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@400;500;600&family=Noto+Serif+SC:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="/js/theme-toggle.js"></script>
    <link rel="stylesheet" href="/css/main.css" />

  </head>
  <body>
    <div class="page-wrapper">

      <header class="site-header">
        
        <a class="site-brand" href="/">
          <span class="site-brand__glyph">◆</span>
          <strong class="site-brand__en">The Learning Grove</strong>
          <span class="site-brand__zh">林间拾穗</span>
        </a>

        
        <nav class="main-nav" aria-label="主导航">
          <ul>
            <li><a href="/">首页</a></li>
            <li><a href="/all-tags/">标签</a></li>
            <li><a href="/all-speakers/">来源</a></li>
            <li><a href="/x/">X 阅读</a></li>
            <li><a href="/about/">关于</a></li>
          </ul>
        </nav>

        
        <div class="search-container">
          <form id="search" class="header-search" action="/search/" role="search">
            <input type="search" name="q" aria-label="搜索文章" placeholder="搜索文章…" required>
            <button type="submit" aria-label="搜索">{{ partial "icon.html" "search" }}</button>
          </form>
          <button id="theme-toggle" class="theme-toggle" title="切换主题" aria-label="切换阅读主题">
            {{ partial "icon.html" "theme" }}
          </button>
        </div>
      </header>

      <main class="site-content">
        {{ partial "page.html" . }}
      </main>

      <footer class="site-footer">
        <p>&copy; {{ now.Year }} Austery &nbsp;·&nbsp; All rights reserved.</p>
      </footer>

    </div>

    <script>
      const site_url = "/";
    </script>
  </body>
</html>
