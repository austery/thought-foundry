name: Validate native Hugo release input
on:
  push:
    branches: [codex/native-hugo-migration]
    paths: ['.github/workflows/validate-native-release-input.yml']
  workflow_dispatch:
    inputs:
      content_sha:
        description: Exact content commit to validate for release
        required: true
        default: '711c18c4f3796176beba0cfb7a74b5134ff9a9f4'
        type: string
permissions:
  contents: read
concurrency:
  group: native-release-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: cold, repetition: 1 }
    name: ${{ matrix.mode }}-${{ matrix.repetition }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TZ: UTC
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin the release content input
        env:
          CONTENT_SHA: ${{ inputs.content_sha || '711c18c4f3796176beba0cfb7a74b5134ff9a9f4' }}
        run: |
          node -e 'const fs=require("fs"); const sha=process.env.CONTENT_SHA; if(!/^[a-f0-9]{40}$/.test(sha))throw Error("Expected exact content SHA"); const path="benchmark/config.json"; const config=JSON.parse(fs.readFileSync(path)); config.contentSha=sha; fs.writeFileSync(path,JSON.stringify(config,null,2));'
      - id: pins
        run: |
          node -e 'const c=require("./benchmark/config.json"); for(const [k,v] of Object.entries(c)) console.log(`${k}=${v}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pins.outputs.baselineSha }}
          path: .benchmark/baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: austery/thought-foundry-content
          ref: ${{ steps.pins.outputs.contentSha }}
          path: .benchmark/source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Install pinned Hugo in runner temporary directory
        env:
          HUGO_VERSION: ${{ steps.pins.outputs.hugoVersion }}
        run: |
          mkdir -p "$RUNNER_TEMP/hugo"
          cd "$RUNNER_TEMP/hugo"
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          curl --fail --location --retry 3 --output checksums.txt "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          awk -v archive="$archive" '$2 == archive {print}' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf "$archive" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Install measurement tools
        run: |
          pnpm install --dir benchmark --frozen-lockfile
          pnpm install --dir native --frozen-lockfile
      - name: Prepare complete source copy
        id: prepare
        run: pnpm --dir benchmark run run prepare ../.benchmark/source ../.benchmark/baseline ../.benchmark/reports
      - name: Measure dependency installation
        run: pnpm --dir benchmark run run measure install ../.benchmark/baseline ../.benchmark/reports pnpm install --frozen-lockfile
      - name: Record installed engine versions
        run: pnpm --dir benchmark run run versions ../.benchmark/baseline ../.benchmark/reports/versions.json
      - name: Validate tools and real miniature pair
        run: |
          pnpm --dir benchmark check
          pnpm --dir benchmark test
          pnpm --dir native check
          pnpm --dir native test
      - name: Run paired complete-content comparison
        run: pnpm --dir benchmark run run native-pair ${{ matrix.mode }} ${{ matrix.repetition }} ../.benchmark/baseline ../.benchmark/builds ../.benchmark/reports
      - name: Verify unchanged source even after build failure
        if: always() && steps.prepare.outcome == 'success'
        run: pnpm --dir benchmark run run verify-source ../.benchmark/source ../.benchmark/reports/source-before.json ../.benchmark/reports/source-after.json
      - name: Prepare preview artifact directory
        if: matrix.mode == 'cold' && matrix.repetition == 1
        run: mkdir -p artifacts/native-previews
      - name: Package baseline preview
        if: matrix.mode == 'cold' && matrix.repetition == 1
        run: pnpm --dir benchmark run run measure package ../.benchmark/builds/measured ../.benchmark/reports tar -czf ../../../artifacts/native-previews/baseline-preview.tar.gz public
      - name: Package candidate preview
        if: matrix.mode == 'cold' && matrix.repetition == 1
        run: pnpm --dir benchmark run run measure hugo-package ../.benchmark/builds/measured-hugo ../.benchmark/reports tar -czf ../../../artifacts/native-previews/candidate-preview.tar.gz public
      - name: Verify packaged preview entry points
        if: matrix.mode == 'cold' && matrix.repetition == 1
        run: |
          tar -tzf artifacts/native-previews/baseline-preview.tar.gz public/index.html > /dev/null
          tar -tzf artifacts/native-previews/candidate-preview.tar.gz public/index.html > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.mode }}-${{ matrix.repetition }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .benchmark/reports
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: matrix.mode == 'cold' && matrix.repetition == 1
        with:
          name: native-previews-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native-previews/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
