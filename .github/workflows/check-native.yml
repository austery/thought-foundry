name: Check native Hugo
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native
      - run: pnpm check
      - run: pnpm test
