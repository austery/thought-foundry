name: Build and Deploy to Public Repo
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
concurrency:
  group: pages-deployment
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout content
        uses: actions/checkout@v4
        with:
          repository: austery/thought-foundry-content
          ref: main
          path: src/content
          persist-credentials: false
      - uses: ./.github/actions/setup-native
      - name: Check native tools
        run: |
          pnpm --dir native check
          pnpm --dir native test
      - name: Build with native Hugo and full Pagefind
        run: |
          mkdir .native-production
          pnpm --dir native exec node --import tsx src/release-cli.ts stage-source .. ../.native-production/source
          pnpm --dir native prepare-site ../.native-production/source ../.native-production/staging
          hugo --source .native-production/staging --destination "$GITHUB_WORKSPACE/.native-production/public"
          pnpm --dir native restore ../.native-production/staging ../.native-production/public
          pnpm --dir native exec pagefind --site ../.native-production/public
          pnpm --dir native exec node --import tsx src/release-cli.ts prepare-publication ../.native-production/public
          pnpm --dir native exec node --import tsx src/release-cli.ts manifest ../.native-production/public ../.native-production/manifest.json
      - name: Record source and output identities
        run: |
          git rev-parse HEAD > .native-production/site-sha.txt
          git -C src/content rev-parse HEAD > .native-production/content-sha.txt
      - name: Retain deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .native-production/manifest.json
            .native-production/site-sha.txt
            .native-production/content-sha.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Deploy to existing public repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: austery/austery.github.io
          publish_dir: ./.native-production/public
          publish_branch: main
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          # Preserve the existing policy that prevents generated-history quota growth.
          force_orphan: true
          commit_message: Native Hugo build ${{ github.sha }} (run ${{ github.run_id }})
