name: Publish approved native output
on:
  workflow_dispatch:
    inputs:
      validation_run:
        description: Successful fresh-input validation run ID
        required: true
        type: string
      validation_attempt:
        description: Exact successful run attempt
        required: true
        type: string
      candidate_sha:
        description: Exact candidate code SHA recorded by validation
        required: true
        type: string
      content_sha:
        description: Exact approved content SHA
        required: true
        type: string
      archive_sha256:
        description: Approved candidate-preview.tar.gz SHA-256
        required: true
        type: string
      previous_output_sha:
        description: Approved production main SHA to replace, backed up before publishing
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: pages-deployment
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VALIDATION_RUN: ${{ inputs.validation_run }}
  VALIDATION_ATTEMPT: ${{ inputs.validation_attempt }}
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  CONTENT_SHA: ${{ inputs.content_sha }}
  ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
  PREVIOUS_OUTPUT_SHA: ${{ inputs.previous_output_sha }}
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native
      - name: Check release tools
        run: |
          pnpm --dir native check
          pnpm --dir native test
      - name: Validate inputs and download exact validation artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VALIDATION_RUN" =~ ^[0-9]+$ && "$VALIDATION_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ && "$CONTENT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PREVIOUS_OUTPUT_SHA" =~ ^[a-f0-9]{40}$ && "$ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          mkdir .native-release
          gh api "repos/austery/thought-foundry/actions/runs/$VALIDATION_RUN" > .native-release/run.json
          gh run download "$VALIDATION_RUN" --repo austery/thought-foundry --name "native-cold-1-$VALIDATION_RUN-$VALIDATION_ATTEMPT" --dir .native-release/reports
          gh run download "$VALIDATION_RUN" --repo austery/thought-foundry --name "native-previews-$VALIDATION_RUN-$VALIDATION_ATTEMPT" --dir .native-release/previews
          pnpm --dir native exec node --import tsx src/release-cli.ts verify-evidence ../.native-release/run.json ../.native-release/reports "$VALIDATION_RUN" "$VALIDATION_ATTEMPT" "$CANDIDATE_SHA" "$CONTENT_SHA"
      - name: Verify and extract approved output
        run: |
          pnpm --dir native exec node --import tsx src/release-cli.ts extract ../.native-release/previews/candidate-preview.tar.gz "$ARCHIVE_SHA256" ../.native-release/candidate
          pnpm --dir native exec node --import tsx src/release-cli.ts prepare-publication ../.native-release/candidate/public
          pnpm --dir native exec node --import tsx src/release-cli.ts manifest ../.native-release/candidate/public ../.native-release/candidate-manifest.json
      - name: Checkout current public output
        uses: actions/checkout@v4
        with:
          repository: austery/austery.github.io
          ref: main
          path: .native-release/published
          ssh-key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
      - name: Verify current output identity and create recoverable backup
        run: |
          set -euo pipefail
          test "$(git -C .native-release/published rev-parse HEAD)" = "$PREVIOUS_OUTPUT_SHA"
          mkdir .native-release/old-output
          rsync -a --exclude=/.git/ .native-release/published/ .native-release/old-output/
          pnpm --dir native exec node --import tsx src/release-cli.ts backup ../.native-release/old-output ../.native-release/backup
          printf '%s\n' "$PREVIOUS_OUTPUT_SHA" > .native-release/backup/published-sha.txt
      - name: Retain verified rollback archive before any publication
        uses: actions/upload-artifact@v4
        with:
          name: production-before-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .native-release/backup/output.tar.gz
            .native-release/backup/manifest.json
            .native-release/backup/verification.json
            .native-release/backup/published-sha.txt
            .native-release/candidate-manifest.json
            .native-release/run.json
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Check paused publisher and content freshness immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/austery/thought-foundry/actions/workflows/deploy.yml --jq .state)" = disabled_manually
          active="$(gh api --paginate 'repos/austery/thought-foundry/actions/workflows/deploy.yml/runs?per_page=100' --jq '.workflow_runs[] | select(.status != "completed") | .id')"
          test -z "$active"
          test "$(git ls-remote https://github.com/austery/thought-foundry-content.git refs/heads/main | cut -f1)" = "$CONTENT_SHA"
      - name: Publish approved archive with exact previous-head lease
        run: |
          git -C .native-release/published config user.name 'github-actions[bot]'
          git -C .native-release/published config user.email 'github-actions[bot]@users.noreply.github.com'
          pnpm --dir native exec node --import tsx src/release-cli.ts publish ../.native-release/candidate/public ../.native-release/published "$PREVIOUS_OUTPUT_SHA" "Native Hugo release $CANDIDATE_SHA content $CONTENT_SHA"
